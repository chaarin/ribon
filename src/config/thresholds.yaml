# 의사결정에 쓰이는 모든 기준값.
# 출처가 있는 값은 출처를 적고, 나머지는 가정값으로 표시한다. 근거가 확보되면 갱신한다.

wear:
  vb_limit_mm: 0.3               # 교체 한계 VBmax. ISO 8688-2의 일반적 공구수명 기준(VB 0.3 mm)
  uneven_index_threshold: 0.3    # 편마모 지수 (max-min)/mean 이 이 값 이상이면 편마모 (가정값)
  uneven_min_vb_mm: 0.05         # 평균 VB가 이 값 미만이면 편마모를 판단하지 않음 (초기 마모 구간의 노이즈 방지, 가정값)
  inspect_uncertainty_mm: 0.02   # 가장 많이 닳은 날의 예측 불확실성이 이 값 이상이면 검사 후보 (가정값)
  reinspect_delta_mm: 0.05       # 실측한 날은 그 뒤 예측 VB가 이만큼 늘어야 다시 검사 (가정값)
  remeasure_uncertainty_mm: 0.08 # 4날 평균 불확실성이 이 값 이상이면 센서 재측정 (가정값)
  min_signal_quality: 0.8        # 가장 나쁜 채널의 유효 샘플 비율이 이 값 미만이면 센서 재측정 (가정값)

quality:
  # 품질 위험은 VB→Ra 추정이 아니라 마모 상태로 판단한다.
  # 참조 데이터(Nguyen et al. 2024, L27)에서 VB와 Ra의 상관이 거의 없어(r≈0.06) Ra 추정 곡선을 쓸 근거가 없기 때문.
  vb_medium_mm: 0.2              # Li et al. (2018): Ti-6Al-4V 고속가공에서 VB < 0.2 mm일 때 과도한 표면 결함을 피함 (해당 실험의 관찰값)
  vb_high_mm: 0.3                # ISO 8688-2 공구수명 기준
  rapid_increment_mm: 0.02       # 직전 Cycle 대비 VB 증가량이 이 값 이상이면 급속 마모 (MEDIUM 이상에서 위험 한 단계 상향, 가정값)
  reference_vb_window_mm: 0.03   # 참조 데이터에서 현재 VB ± 이 범위의 실험을 찾아 Ra 범위를 근거로 제시

economics:
  # 위험 등급별 부품 1개당 불량 확률 (가정값). 비용은 새 공구(LOW) 대비 '추가' 불량 확률로 계산한다.
  defect_probability:
    LOW: 0.01
    MEDIUM: 0.05
    HIGH: 0.30
  pressure_slack_min:            # 납기 여유 시간(분) 기준 생산 압박
    high: 60                     # 이 값 미만이면 HIGH
    medium: 240                  # 이 값 미만이면 MEDIUM
  # Production_Priority가 High면 생산 압박을 한 단계 올린다
  after_job_downtime_ratio: 0.5  # 공정 후 교체는 작업 전환(셋업)과 겹쳐 정지 비용이 이 비율로 줄어듦 (가정값)
  downtime_multiplier:           # 생산 압박이 클수록 공정 중 정지 비용이 커짐 (가정값)
    LOW: 1.0
    MEDIUM: 1.5
    HIGH: 2.0

decision:
  max_rechecks_per_cycle: 2      # 한 Cycle에서 재측정·검사 후 재판단을 반복할 수 있는 최대 횟수
